name: Mutate validation
on:
  push:
    branches: [fix/performance-functional-audit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ISO9660 integration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools genisoimage
      - name: Apply Go formatting
        run: gofmt -w cmd internal tests/fixtures
      - name: Commit formatting to feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd internal tests/fixtures
            git commit -m "style: gofmt performance and functional fixes"
            git push
          fi
      - name: Verify POSIX installer and offline install paths
        run: |
          sh -n install.sh
          dash -n install.sh
          sh tests/install_test.sh
      - name: Build and test
        run: |
          CGO_ENABLED=0 go build ./...
          go test ./...
