name: Mutate validation
on:
  push:
    branches: [refactor/package-boundaries-and-staging]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply Go formatting
        run: gofmt -w cmd internal tests/fixtures
      - name: Commit formatting on feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd internal tests/fixtures
            git commit -m "style: gofmt package boundary refactor"
            git push
          fi
      - name: Verify POSIX installer and offline install paths
        run: |
          sh -n install.sh
          dash -n install.sh
          sh tests/install_test.sh
      - name: Check matrix scripts
        run: |
          bash -n tests/os_matrix/run_matrix.sh
          sh -n tests/os_matrix/test_in_container.sh
          sh -n tests/real_packages/test_real_packages.sh
      - name: Generate portable fixtures
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          go run tests/fixtures/generate_fixtures.go "$tmp"
          for artifact in sample.deb sample.rpm sample.pkg.tar.zst sample-alpine.apk sample-android.apk sample-source.tar.gz sample.AppImage; do
            test -s "$tmp/$artifact"
          done
      - name: Build and test
        run: |
          CGO_ENABLED=0 go build ./...
          go test ./...
