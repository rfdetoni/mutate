name: Mutate validation
on:
  push:
    branches: [feat/native-gui-remote-repositories]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format Go and pin Wails dependencies on feature branch
        run: |
          gofmt -w cmd internal tests/fixtures desktop
          (cd desktop && go mod tidy)
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard desktop)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd internal tests/fixtures desktop
            git commit -m "style: format Go and pin native Wails dependencies"
            git push
          fi
      - name: Verify POSIX installer and offline install paths
        run: |
          sh -n install.sh
          dash -n install.sh
          sh tests/install_test.sh
      - name: Check matrix scripts
        run: |
          bash -n tests/os_matrix/run_matrix.sh
          sh -n tests/os_matrix/test_in_container.sh
          sh -n tests/real_packages/test_real_packages.sh
      - name: Validate embedded GUI JavaScript
        run: node --check cmd/mutate/ui/app.js
      - name: Verify benchmark comparison utility
        run: python3 benchmarks/test_compare.py
      - name: Generate portable fixtures
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          go run tests/fixtures/generate_fixtures.go "$tmp"
          for artifact in sample.deb sample.rpm sample.pkg.tar.zst sample-alpine.apk sample-android.apk sample-source.tar.gz sample.AppImage; do
            test -s "$tmp/$artifact"
          done
      - name: Build and test
        run: |
          CGO_ENABLED=0 go build ./...
          go test ./...
