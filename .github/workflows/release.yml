name: Linux binary releases
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate source
        run: |
          CGO_ENABLED=0 go test ./...
          sh -n install.sh
      - name: Build static Linux binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist .release-bin
          for spec in \
            amd64:amd64:0 \
            arm64:arm64:0 \
            386:386:0 \
            armv6:arm:6 \
            riscv64:riscv64:0 \
            ppc64le:ppc64le:0 \
            s390x:s390x:0 \
            loong64:loong64:0
          do
            IFS=: read -r target goarch goarm <<< "$spec"
            echo "Compiling linux/$target"
            GOOS=linux GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o .release-bin/mutate ./cmd/mutate
            tar -czf "dist/mutate_linux_$target.tar.gz" -C .release-bin mutate
          done
          (cd dist && sha256sum mutate_linux_*.tar.gz > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
