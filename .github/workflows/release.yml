name: Linux binary releases
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate source
        run: |
          CGO_ENABLED=0 go test ./...
          sh -n install.sh
      - name: Install native Gio release dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - name: Build portable Linux CLI and native amd64 Gio release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist .release-bin
          (cd desktop && go mod tidy && CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X gioui.org/app.ID=mutate" -o ../.release-bin/mutate-gio .)
          test -s .release-bin/mutate-gio
          for spec in \
            amd64:amd64:0 \
            arm64:arm64:0 \
            386:386:0 \
            armv6:arm:6 \
            riscv64:riscv64:0 \
            ppc64le:ppc64le:0 \
            s390x:s390x:0 \
            loong64:loong64:0
          do
            IFS=: read -r target goarch goarm <<< "$spec"
            echo "Compiling linux/$target"
            if [ "$goarch" = arm ]; then
              GOOS=linux GOARCH=arm GOARM=6 CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" -o .release-bin/mutate ./cmd/mutate
            else
              GOOS=linux GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" -o .release-bin/mutate ./cmd/mutate
            fi
            if [ "$target" = amd64 ]; then
              tar -czf "dist/mutate_linux_$target.tar.gz" -C .release-bin mutate mutate-gio
            else
              tar -czf "dist/mutate_linux_$target.tar.gz" -C .release-bin mutate
            fi
          done
          (cd dist && sha256sum mutate_linux_*.tar.gz > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
