name: Native Gio desktop validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'cmd/mutate/gui.go'
      - 'install.sh'
      - 'tests/install_test.sh'
      - '.github/workflows/native-gui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-gio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: false
      - name: Install native X11/Wayland/GLES build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - name: Test native Gio application
        working-directory: desktop
        run: |
          go mod tidy
          go test ./...
          CGO_ENABLED=1 go build -trimpath -ldflags="-X gioui.org/app.ID=mutate" -o /tmp/mutate-gio .
          test -s /tmp/mutate-gio
